        <script>

let repeatingNumbers = arr.reduce((acc,curr)=> {
acc[curr] = acc[curr] ? acc[curr] + 1 : 1

return acc
},{})


        // Write a function that returns the number which comes maximum times.
let maxCount = 0;
let maxNumber = null;


for(let number in repeatingNumbers){
    if(repeatingNumbers[number] > maxCount){
        maxCount = repeatingNumbers[number];
        maxNumber = number

    }

}

console.log('maxNumber',maxNumber)
}


findRepeatingNumbers(arr);
